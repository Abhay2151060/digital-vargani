version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vargani-postgres
    environment:
      POSTGRES_USER: vargani_user
      POSTGRES_PASSWORD: vargani_password
      POSTGRES_DB: vargani_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vargani_user -d vargani_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vargani-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
