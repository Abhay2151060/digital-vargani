<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Vargani - Offline</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF9F6;
      color: #292118;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid #f0ece1;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: #FFF7ED;
      color: #EA580C;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1c1917;
    }
    p {
      color: #78716c;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background: #EA580C;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    .btn:hover {
      background: #C2410C;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>इंटरनेट कनेक्शन नाही (Offline)</h1>
    <p>कृपया आपले इंटरनेट कनेक्शन तपासा आणि पुन्हा प्रयत्न करा. पूर्वी लोड केलेली माहिती उपलब्ध असू शकते.</p>
    <button class="btn" onclick="window.location.reload()">पुन्हा प्रयत्न करा (Retry)</button>
  </div>
</body>
</html>
